<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Piano</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Virtual Piano</h1>

<div class="piano">

  <!-- WHITE KEYS -->
  <div class="white-key" data-key="a">A</div>
  <div class="white-key" data-key="s">S</div>
  <div class="white-key" data-key="d">D</div>
  <div class="white-key" data-key="f">F</div>
  <div class="white-key" data-key="g">G</div>
  <div class="white-key" data-key="h">H</div>
  <div class="white-key" data-key="j">J</div>
  <div class="white-key" data-key="k">K</div>
  <div class="white-key" data-key="l">L</div>
  <div class="white-key" data-key=";">;</div>

  <!-- BLACK KEYS -->
  <div class="black-key" data-key="q" style="left:9%">Q</div>
  <div class="black-key" data-key="e" style="left:19%">E</div>

  <div class="black-key" data-key="t" style="left:39%">T</div>
  <div class="black-key" data-key="u" style="left:49%">U</div>
  <div class="black-key" data-key="o" style="left:59%">O</div>

  <div class="black-key" data-key="p" style="left:79%">P</div>
  <div class="black-key" data-key="p" style="left:89%">[</div>


</div>
    <script src="script.js"></script>
</body>
</html>
