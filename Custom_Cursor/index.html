<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height: 100%;
            width: 100%;
        }
        html{
        cursor: none;
        }
    .cursor{
        height: 30px;
        width: 30px;
        background-color: blue;
        border-radius: 50%;
        position: fixed;
        transition: 0.05s linear;
    }
    </style>
</head>
<body>
    <div class="cursor"></div>
    <script src="app.js"></script>
</body>
</html>
