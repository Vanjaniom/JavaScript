<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height: 100%;
            width: 100%;
        }
        html{
        cursor: none;
        }
    .cursor{
        height: 30px;
        width: 30px;
        background-color: blue;
        border-radius: 50%;
        position: fixed;
        transition: 0.05s linear;
        opacity: 0.4;
    }
    img{
        height: 50px;
        width: 50px;
        position: absolute;

    }
    </style>
</head>
<body>
    <img src="https://images.unsplash.com/vector-1771940994913-1f9501c00db9?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxpbGx1c3RyYXRpb25zLWZlZWR8MTR8fHxlbnwwfHx8fHw%3D" alt="">
    <div class="cursor"></div>
    <script src="app.js"></script>
</body>
</html>
